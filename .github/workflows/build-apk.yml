name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Initialize Capacitor App Project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Rocky Sideline" "com.rocky.sidelinereporter" --web-dir www
          npx cap add android

      - name: Generate Custom App Icon
        run: |
          # Create an SVG icon with Rocky purple and a football theme
          cat << 'EOF' > icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="115" fill="#4c1d95"/>
            <circle cx="256" cy="256" r="210" fill="#581c87" stroke="#e2e8f0" stroke-width="12"/>
            <path d="M140 256 C140 170 372 170 372 256 C372 342 140 342 140 256 Z" fill="#78350f" stroke="#e2e8f0" stroke-width="8"/>
            <line x1="180" y1="256" x2="332" y2="256" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
            <line x1="216" y1="236" x2="216" y2="276" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
            <line x1="256" y1="232" x2="256" y2="280" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
            <line x1="296" y1="236" x2="296" y2="276" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
          </svg>
          EOF

          npm install -g sharp-cli
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          # Generate standard PNG icons
          sharp -i icon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png resize 48 48
          sharp -i icon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png resize 72 72
          sharp -i icon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png resize 96 96
          sharp -i icon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png resize 144 144
          sharp -i icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png resize 192 192

          # Generate round PNG icons
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          # Generate foreground image for Android Adaptive Icons (required by Pixel launchers)
          sharp -i icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png resize 432 432

          # Force adaptive icon XML to use our custom assets
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:color="#4c1d95"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Fix Kotlin Stdlib Duplicate Classes
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' && 
                          (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                          details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK Output
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/RockySidelineReporter.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RockySidelineReporter-APK
          path: android/app/build/outputs/apk/debug/RockySidelineReporter.apk
