name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Initialize Capacitor App Project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Sideline Reporter" "com.rocky.sidelinereporter" --web-dir www
          npx cap add android

      - name: Fix Kotlin Stdlib Duplicate Classes
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' && 
                          (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                          details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SidelineReporter-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
